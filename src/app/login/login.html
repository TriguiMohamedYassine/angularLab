<div class="login-container">
  <div class="login-card">
    <div class="login-header">
      <h2>Welcome Back</h2>
      <p>Sign in to access your dashboard</p>
    </div>
    
    <form (ngSubmit)="login()" #loginForm="ngForm" class="login-form"> 
      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput placeholder="name@example.com" type="email" 
        [(ngModel)]="email" name="email" required email>
      </mat-form-field>

      <mat-form-field appearance="fill" class="full-width">
        <mat-label>Password</mat-label>
        <input matInput placeholder="Enter your password" type="password" 
        [(ngModel)]="password" name="password" required>
      </mat-form-field>

      <button type="submit" class="login-button" [disabled]="!loginForm.valid">
        Log In
      </button>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }
    </form>
  </div>
</div>
